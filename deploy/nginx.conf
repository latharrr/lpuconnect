# /etc/nginx/sites-available/uniconnect  (certificates via: certbot --nginx -d api.example.com -d staging-api.example.com)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream uniconnect { server 127.0.0.1:3001; keepalive 32; }
upstream uniconnect_staging { server 127.0.0.1:3101; keepalive 8; }

server {
    listen 443 ssl http2;
    server_name api.example.com;
    # ssl_certificate / ssl_certificate_key managed by certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 16k;

    location /socket.io/ {
        proxy_pass http://uniconnect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://uniconnect;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-api.example.com;
    location / {
        proxy_pass http://uniconnect_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.example.com staging-api.example.com;
    return 301 https://$host$request_uri;
}
