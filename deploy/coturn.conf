# /etc/turnserver.conf  (apt install coturn). Credentials are minted by the API from the
# same secret (GET /api/turn), valid for TURN_TTL_SECONDS, so nothing static ships in the app.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_same_as_TURN_SECRET
realm=turn.example.com
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

min-port=49160
max-port=49660
total-quota=200
user-quota=6
# ~2 Mbit/s per session; caps relay bandwidth on a shared VPS
max-bps=262144
bps-capacity=0
stale-nonce=600
no-cli
no-multicast-peers
# Never relay into the server's own networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
log-file=/var/log/turnserver.log
simple-log
